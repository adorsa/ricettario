<main class="min-h-screen bg-gray-50 py-8">
    @if(supabaseService.isAuthenticated()) {
        <div class="max-w-2xl mx-auto px-4 mb-4 flex justify-between items-center bg-white p-3 rounded-lg shadow-sm border border-gray-100">
            <span class="text-xs text-gray-500 font-medium">🧑‍🍳 {{ supabaseService.currentUser()?.email }}</span>
            <button (click)="logout()" class="text-xs text-red-500 hover:text-red-700 font-semibold">Logout</button>
        </div>
    }
    @else {
        <a class="max-w-2xl mx-auto px-4 mb-4 flex justify-between items-center bg-white p-3 rounded-lg shadow-sm border border-gray-100" [routerLink]="'/auth'">Log in / Sign up</a>
    }

    <router-outlet></router-outlet>
</main>

<app-timer-widget></app-timer-widget>
