<div 
    [class.has-timers]="timerService.activeTimers().length > 0" 
    class="app-container min-h-screen bg-slate-50 flex flex-col justify-between transition-all duration-300"
>
    <main class="main-content flex-1 relative">
        <div class="max-w-2xl mx-auto px-4 mb-4 flex justify-between items-center bg-white p-3 rounded-lg shadow-sm border border-gray-100 mt-4">
            @if(supabaseService.isAuthenticated()) {
                <span class="text-xs text-gray-500 font-medium">🧑‍🍳 {{ supabaseService.currentUser()?.email }}</span>
            } @else {
                <a class="text-sm text-emerald-700 hover:underline" [routerLink]="'/auth'">{{ i18n.t('app.loginAndSignup') }}</a>
            }
            <div class="flex items-center gap-3">
                <label for="language-select" class="sr-only">{{ i18n.t('language.label') }}</label>
                <select
                    id="language-select"
                    [value]="i18n.language()"
                    (change)="i18n.setLanguage($any($event.target).value)"
                    class="text-xs bg-white border border-gray-300 rounded px-2 py-1 text-gray-700"
                >
                    @for (language of i18n.languages; track language.code) {
                        <option [value]="language.code">{{ language.label }}</option>
                    }
                </select>
                @if(supabaseService.isAuthenticated()) {
                    <button (click)="logout()" class="text-xs text-red-500 hover:text-red-700 font-semibold">{{ i18n.t('app.logout') }}</button>
                }
            </div>
        </div>

        <router-outlet></router-outlet>
    </main>

  <app-timer-widget></app-timer-widget>
</div>
