<div class="max-w-md mx-auto mt-12 p-6 bg-white rounded-lg shadow-md font-sans text-gray-800 border border-gray-200">
    <h2 class="text-2xl font-bold mb-6 text-center text-emerald-700">
    {{ isLoginMode() ? 'Log into your recipe book' : 'Create a new account' }}
    </h2>
    @if(errorMessage()) {
        <div class="mb-4 p-3 bg-red-100 text-red-700 rounded text-sm">
        {{ errorMessage() }}
        </div>
    }
    @if(successMessage()) {
        <div class="mb-4 p-3 bg-green-100 text-green-700 rounded text-sm">
        {{ successMessage() }}
        </div>
    }

    <form (ngSubmit)="onSubmit()" #authForm="ngForm" class="space-y-4">
    <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input 
        type="email" 
        [(ngModel)]="email" 
        name="email" 
        required 
        email
        class="w-full p-2 border rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none"
        placeholder="tua@email.com"
        />
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input 
        type="password" 
        [(ngModel)]="password" 
        name="password" 
        required 
        minlength="6"
        class="w-full p-2 border rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none"
        placeholder="******"
        />
    </div>

    <button 
        type="submit" 
        [disabled]="authForm.invalid || isLoading()"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded transition-colors disabled:opacity-50"
    >
        {{ isLoading() ? 'Please wait...' : (isLoginMode() ? 'Log in' : 'Sign up') }}
    </button>
    </form>

    <div class="mt-6 text-center text-sm">
    <button 
        type="button" 
        (click)="toggleMode()" 
        class="text-emerald-600 hover:underline focus:outline-none"
    >
        {{ isLoginMode() ? "You don't have an account? Register" : "You already have an account? Log in" }}
    </button>
    </div>
</div>
